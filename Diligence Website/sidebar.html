<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="style.css">
    <script src="sidebar.js" defer></script>
    <script src="script.js"></script>
  </head>
  <body>
<nav class="sidebar close">
    <header>
        <div class="image-text">
            <span class="image">
                <img src="assets/tabIcon.jpg" alt="logo">
            </span>

            <div class="text header-text">
                <span class="name">Full Name</span>
                <span class="profession">User / Admin</span>
            </div>
        </div>

        <i class="bx bx-chevron-right toggle"></i>
    </header>

    <div class="menu-bar">
        <div class="menu">
            <ul class="menu-links">
                <li class="nav-link">
                    <a href="dashboard.html">
                        <i class="bx bx-home-alt icon"></i>
                        <span class="text nav-text">Dashboard</span>
                    </a>
                </li>

                <li class="nav-link">
                    <a href="goals.html">
                        <i class="bx bxs-flag icon"></i>
                        <span class="text nav-text">Goals</span>
                    </a>
                </li>

                <li class="nav-link">
                    <a href="projects.html">
                        <i class="bx bx-folder-open icon"></i>
                        <span class="text nav-text">Projects</span>
                    </a>
                </li>

                <li class="nav-link">
                    <a href="tasks.html">
                        <i class="bx bxs-check-circle icon"></i>
                        <span class="text nav-text">Tasks</span>
                    </a>
                </li>

                <li class="nav-link">
                    <a href="notes.html">
                        <i class="bx bx-note icon"></i>
                        <span class="text nav-text">Notes</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="bottom-content">

            <li class="mode">
                <div class="moon-sun">
                    <i class="bx bx-moon icon moon"></i>
                    <i class="bx bx-sun icon sun"></i>
                </div>

                <span class="mode-text text">Dark Mode</span>

                <div class="toggle-switch">
                    <span class="switch"></span>
                </div>
            </li>
        </div>
    </div>
</nav>


  </body>
</html>
